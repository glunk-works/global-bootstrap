# .ai/project.yml -- global-bootstrap's parameterization of the `way-of-working` plugin.
# Contract: `reference/project-schema.md` inside the plugin. Values describe this repo as it
# is on 2026-10-02; a change to one of these facts updates this file in the same PR.
# This repo has no CLAUDE.md, CI workflows or branch ruleset as of this date. `null` on
# ruleset.name records that: the schema does not yet allow `null` there
# (`schema-complete.sh check` reports it invalid), so this file stays INCOMPLETE until the repo
# adds a ruleset. Never invent a name to satisfy it.

repo: glunk-works/global-bootstrap
pr_base: main
migration_base: null

roadmap: "docs/roadmap.md"
sprints_dir: "docs/sprints"
threat_model: "docs/threat_model.md"

planning:
  kind: github_milestones

decisions:
  log: "docs/decisions.md"
  prefix: "GB-D"

backlog:
  kind: github_issues
  repo: null
  path: null
  item_prefix: null

load_bearing_docs:
  - README.md

# Applied by hand with `tofu apply`; IAM and OIDC trust policies decide what every other
# repo's CI may do in AWS, so every .tf file is a behavior change.
code_paths:
  - "*.tf"

# `-backend=false` so validate needs no AWS credentials.
gates:
  green:
    - { run: tofu fmt -check -recursive }
    - { run: "tofu init -backend=false && tofu validate" }

ruleset:
  name: null
  rule_types: []
  required_checks: []

review:
  ci_gate: null

agents:
  enabled: [architect, coder, security-critic, docs-consistency]
models:
  architect: opus
  coder: sonnet
  second_opinion: fable
