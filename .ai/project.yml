# .ai/project.yml -- global-bootstrap's parameterization of the `way-of-working` plugin.
# Contract: `reference/project-schema.md` inside the plugin. Values describe this repo as it
# is on 2026-10-02; a change to one of these facts updates this file in the same PR.
# As of 2026-10-28 the repo has a CI workflow (`validate`) and two active rulesets on main,
# `main-required-checks` (checks) and `protected-integration-branches` (approval); it has no CLAUDE.md.

repo: glunk-works/global-bootstrap
pr_base: main
migration_base: null

roadmap: "docs/roadmap.md"
sprints_dir: "docs/sprints"
threat_model: "docs/threat_model.md"

planning:
  kind: github_milestones

decisions:
  log: "docs/decisions.md"
  prefix: "GB-D"

backlog:
  kind: github_issues
  repo: null
  path: null
  item_prefix: null

load_bearing_docs:
  - README.md

# Applied by hand with `tofu apply`; IAM and OIDC trust policies decide what every other
# repo's CI may do in AWS, so every file under infra/ is a behavior change.
code_paths:
  - infra/

# `-backend=false` so validate needs no AWS credentials.
gates:
  green:
    - { run: tofu fmt -check -recursive }
    - { run: "tofu -chdir=infra init -backend=false && tofu -chdir=infra validate" }

ruleset:
  name: main-required-checks
  rule_types: [required_status_checks]
  required_checks: [validate, architect-review]

rulesets:
  - name: main-required-checks
    source: repo
    rule_types: [required_status_checks]
    required_checks: [validate, architect-review]
  - name: protected-integration-branches
    source: repo
    rule_types: [deletion, non_fast_forward, pull_request]

review:
  ci_gate:
    check: architect-review
    header: "**Opus/Architect review (automated)**"
    attestation: "*Fresh-session review: this session did not author the diff.*"
    triggers_on: null # null means code_paths; a PR touching nothing under code_paths is not gated.

agents:
  enabled: [architect, coder, security-critic, docs-consistency]
  diff_rule: null
models:
  architect: opus
  coder: sonnet
  second_opinion: fable

orchestration: null
identities:
  maintainer:
    - {login: Seuss27, id: 22668449}
  dev_app: {login: "glunk-dev[bot]", id: 339840170}
  reviewer_app: {login: "glunk-review[bot]", id: 339841158}
  loop_app: {login: "glunk-loop[bot]", id: 338193635}
